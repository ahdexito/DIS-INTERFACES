<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login/login.css">
    <title>WebMaster | Registro</title>
    <script src="https://kit.fontawesome.com/bc8e4b1cda.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <img src="./img/logo-webmaster2.png" alt="logotipo">
        <h1>WebMaster</h1>
    </header>

    <h2>Aprende, programa, evoluciona.</h2>

    <main>
        <form action="#" method="POST">
            <h3>Introduce tus datos</h3>

            <hr>

            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" name="nombre" id="nombre" placeholder="Nombre" required>
            </div>

            <div class="form-group">
                <label for="apellidos">Apellidos</label>
                <input type="text" name="apellidos" id="apellidos" placeholder="Apellidos">
            </div>
            
            <div class="form-group">
                <label for="nacimiento">Fecha de nacimiento</label>
                <input type="date" name="nacimiento" id="nacimiento" required>
            </div>
            
            <div class="form-group-genero">
                <p>Género</p>

                <div class="btns-genero">
                    <div class="form-genero">
                        <input type="radio" name="genero" id="hombre" value="hombre" required>
                        <label for="hombre">Hombre</label>
                    </div>
                    
                    <div class="form-genero">
                        <input type="radio" name="genero" id="mujer" value="mujer" required>
                        <label for="mujer">Mujer</label>
                    </div>
                    
                    <div class="form-genero">
                        <input type="radio" name="genero" id="otro" value="otro" required>
                        <label for="otro">Otro</label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="telefono">Teléfono</label>
                <input type="tel" name="telefono" id="telefono" placeholder="Teléfono">
            </div>
            
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" name="email" id="email" placeholder="Correo electrónico" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" name="password" id="password" placeholder="Contraseña" required>
            </div>
            
            <hr>

            <div class="register-footer">
                <a href="login.html">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <button type="submit">Registrarme</button>
            </div>
        </form>
    </main>
</body>
</html>

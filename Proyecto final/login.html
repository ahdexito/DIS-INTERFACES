<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login/login.css">
    <title>WebMaster | Login</title>
</head>
<body>
    <header>
        <img src="./img/logo-webmaster2.png" alt="logotipo">
        <h1>WebMaster</h1>
    </header>

    <h2>Aprende, programa, evoluciona.</h2>

    <main>
        <form action="index.html" method="GET">
            <h3>¡Hola de nuevo!</h3>
            <hr>
            <input type="email" name="email" id="email" placeholder="Correo electrónico">
            <input type="password" name="password" id="password" placeholder="Contraseña">
            <div class="recuerdame">
                <input type="checkbox" name="check" class="check">
                <label for="check">recuérdame</label>
            </div>
            <hr>
            <button type="submit">Iniciar sesión</button>
        </form>
        
        <section class="registrarse">
            <h3>¿Quieres unirte?</h3>
            <hr>
            <p>
                Aprende con proyectos reales diseñados por expertos para que 
                trabajes como desarrollador desde el primer día.
            </p>
            <hr>
            <a href="register.html"><button>Registrarse</button></a>
        </section>
    </main>
</body>
</html>

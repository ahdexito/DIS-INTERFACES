<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>DecaShop</title>
</head>
<body>
    <header>
        <a href="#"><img src="icon/letra-d.png" alt="icono logotipo"></a>
        <img id="burger" src="icon/hamburguesa.png" alt="icono menú hamburguesa">
        <a id="carrito" href="#"><img src="icon/carrito.png" alt="icono carrito"></a>
        <a id="avatar" href="#"><img src="icon/avatar.png" alt="icono avatar"></a>
    </header>

    <main>
        <section class="catalogo">
            <img src="img/zapatillas-azules.jpg" alt="zapatillas azules">
            <img src="img/chaqueta.jpg" alt="chaqueta">
            <img src="img/pantalones.jpg" alt="pantalones">
        </section>

        <section class="botones">
            <a href="#"><button>NOVEDADES</button></a>
            <a href="#"><button>LO MÁS BUSCADO</button></a>
            <a href="#"><button>PRÓXIMAMENTE</button></a>
        </section>

        <section class="productos">

        </section>

        <section class="inscribete">
            <p>
                Únete a nuestra membresía y transforma 
                tu dedicación en recompensas únicas, diseñadas 
                para entusiastas del deporte como tú. En DecaShop 
                premiamos tu fidelidad. ¡Lleva tu experiencia 
                deportiva más allá!
            </p>
            <a href="#"><button>INSCRÍBETE</button></a>
        </section>
    </main>

    <footer>
        <a href="#">Aviso de privacidad</a>
        <a href="#">Términos y condiciones</a>
        <a href="#">Mapa web</a>
    </footer>
</body>
</html>
